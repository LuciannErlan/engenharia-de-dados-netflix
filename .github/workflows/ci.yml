name: Data Pipeline CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  quality-and-tests:
    name: Ruff Lint + Pytest + dbt Parse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check src tests dashboard

      - name: Run unit tests (Pytest)
        run: pytest -v

      - name: Validate dbt project structure & Jinja compilation (offline parse)
        working-directory: dbt_netflix
        env:
          GCP_PROJECT_ID: ci-mock-project
          BQ_RAW_DATASET: netflix_raw
          BQ_ANALYTICS_DATASET: netflix_analytics
          GCP_LOCATION: us-central1
        run: dbt parse --profiles-dir .

