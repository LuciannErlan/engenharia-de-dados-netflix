name: netflix-analytics-bi

services:
  metabase-db:
    image: postgres:16-alpine
    container_name: netflix_metabase_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MB_DB_USER:-metabase}
      POSTGRES_PASSWORD: ${MB_DB_PASS:-metabase_secret_2026}
      POSTGRES_DB: ${MB_DB_NAME:-metabase_app}
    volumes:
      - metabase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-metabase} -d $${POSTGRES_DB:-metabase_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: netflix_metabase
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
    ports:
      - "${MB_PORT:-3000}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${MB_DB_NAME:-metabase_app}
      MB_DB_PORT: 5432
      MB_DB_USER: ${MB_DB_USER:-metabase}
      MB_DB_PASS: ${MB_DB_PASS:-metabase_secret_2026}
      MB_DB_HOST: metabase-db
      JAVA_TIMEZONE: America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15

volumes:
  metabase_pgdata:
    name: netflix_metabase_pgdata

